    <script>
        const canvas = document.getElementById('psp-canvas');
        // alpha: false отключает лишнее композитное смешивание на GPU
        const ctx = canvas.getContext('2d', { alpha: false });
        
        let width = 0;
        let height = 0;
        let time = 0;
        let lastTime = performance.now();
        let animationFrameId = null;

        // Предварительно кэшированные градиенты и параметры волн
        let bgGradient, wave1Gradient, wave2Gradient;
        let wave1Y, wave2Y, neonWaveY;

        function updateGradients() {
            bgGradient = ctx.createLinearGradient(0, 0, 0, height);
            bgGradient.addColorStop(0, '#1c1c1c'); 
            bgGradient.addColorStop(1, '#050505');

            wave1Y = height * 0.65;
            wave1Gradient = ctx.createLinearGradient(0, wave1Y - 240, 0, wave1Y + 240);
            wave1Gradient.addColorStop(0, 'rgba(150, 150, 150, 0)');
            wave1Gradient.addColorStop(0.5, 'rgba(200, 200, 200, 0.08)');
            wave1Gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            wave2Y = height * 0.60;
            wave2Gradient = ctx.createLinearGradient(0, wave2Y - 180, 0, wave2Y + 180);
            wave2Gradient.addColorStop(0, 'rgba(255, 255, 255, 0.03)');
            wave2Gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.15)');
            wave2Gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            neonWaveY = height * 0.55;
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            updateGradients();
        }

        window.addEventListener('resize', resize, { passive: true });
        resize();

        function drawPSPWave(yOffset, baseAmp, freq, speed, phaseOffset, fillStyle) {
            ctx.beginPath();
            const endX = width + 20;
            for (let x = 0; x <= endX; x += 10) {
                const noise = Math.sin(x * freq * 2 + time * speed * 1.5) * baseAmp * 0.3;
                const y = yOffset + noise + Math.sin(x * freq + time * speed + phaseOffset) * baseAmp;
                if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.lineTo(width, height + 100);
            ctx.lineTo(0, height + 100);
            ctx.closePath();
            ctx.fillStyle = fillStyle;
            ctx.fill();
        }

        function render(now) {
            // Нормализация по времени для плавной работы на экранах 60/120/144+ Гц
            const delta = Math.min((now - lastTime) / 16.6667, 3);
            lastTime = now;
            time += 0.005 * delta;

            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            drawPSPWave(wave1Y, 120, 0.001, 0.7, 0, wave1Gradient);
            drawPSPWave(wave2Y, 90, 0.0015, 1.1, 2, wave2Gradient);

            // Неоновая линия
            ctx.beginPath();
            const endX = width + 20;
            for (let x = 0; x <= endX; x += 10) {
                const noise = Math.sin(x * 0.003 + time * 1.8) * 8; // 40 * 0.2
                const y = neonWaveY + noise + Math.sin(x * 0.002 + time * 1.5 + 4) * 60;
                if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.shadowBlur = 15;
            ctx.shadowColor = 'rgba(255, 255, 255, 0.6)';
            ctx.stroke();
            ctx.shadowBlur = 0;

            animationFrameId = requestAnimationFrame(render);
        }

        // Приостановка рендеринга при неактивной вкладке для экономии ресурсов и батареи
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (animationFrameId) {
                    cancelAnimationFrame(animationFrameId);
                    animationFrameId = null;
                }
            } else {
                lastTime = performance.now();
                if (!animationFrameId) {
                    animationFrameId = requestAnimationFrame(render);
                }
            }
        });

        animationFrameId = requestAnimationFrame(render);
    </script>
