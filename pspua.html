    <script>
        const canvas = document.getElementById('psp-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, time = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function drawPSPWave(yOffset, baseAmp, freq, speed, phaseOffset, primaryColor, secondaryColor) {
            ctx.beginPath();
            for (let x = 0; x <= width + 20; x += 10) {
                let noise = Math.sin(x * freq * 2 + time * speed * 1.5) * baseAmp * 0.3;
                let y = yOffset + noise + Math.sin(x * freq + time * speed + phaseOffset) * baseAmp;
                if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.lineTo(width, height + 100); ctx.lineTo(0, height + 100); ctx.closePath();
            let gradient = ctx.createLinearGradient(0, yOffset - baseAmp * 2, 0, yOffset + baseAmp * 2);
            gradient.addColorStop(0, primaryColor); gradient.addColorStop(0.5, secondaryColor); gradient.addColorStop(1, 'rgba(0, 0, 0, 0)'); 
            ctx.fillStyle = gradient; ctx.fill();
        }

        function animate() {
            let bgGradient = ctx.createLinearGradient(0, 0, 0, height);
            bgGradient.addColorStop(0, '#1c1c1c'); 
            bgGradient.addColorStop(1, '#050505');
            ctx.fillStyle = bgGradient; ctx.fillRect(0, 0, width, height);
            
            const wave1Y = height * 0.65;
            const wave2Y = height * 0.60;
            const neonWaveY = height * 0.55;
            
            drawPSPWave(wave1Y, 120, 0.001, 0.7, 0, 'rgba(150, 150, 150, 0)', 'rgba(200, 200, 200, 0.08)');
            drawPSPWave(wave2Y, 90, 0.0015, 1.1, 2, 'rgba(255, 255, 255, 0.03)', 'rgba(255, 255, 255, 0.15)');
            
            ctx.beginPath();
            for (let x = 0; x <= width + 20; x += 10) {
                let noise = Math.sin(x * 0.003 + time * 1.8) * 40 * 0.2;
                let y = neonWaveY + noise + Math.sin(x * 0.002 + time * 1.5 + 4) * 60;
                if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)'; 
            ctx.lineWidth = 3; ctx.lineCap = 'round';
            ctx.shadowBlur = 15; ctx.shadowColor = 'rgba(255, 255, 255, 0.6)'; 
            ctx.stroke(); ctx.shadowBlur = 0;

            time += 0.005; requestAnimationFrame(animate);
        }
        animate();
    </script>
