        .grid-item {
            position: relative;

            border: 2px solid #665200;
            border-radius: 12px;

            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            -webkit-backdrop-filter: blur(5px);
            backdrop-filter: blur(5px);
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        .grid-item::before {
            content: '✖';
            position: absolute;
            font-size: 3em;
            color: #4d3e00;
            z-index: 0;
            transition: color 0.3s ease;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: relative;
            z-index: 1;
        }

        .grid-item:hover {
            transform: translateY(-5px) scale(1.05);
            border-color: #ffd700;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
            z-index: 2;

    <script>
        const canvas = document.getElementById('psp-canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        let width = 0;
        let height = 0;
        let time = 0;
        let lastTime = performance.now();
        let animationFrameId = null;

        let bgGradient, wave1Gradient, wave2Gradient;
        let wave1Y, wave2Y, neonWaveY;

        function updateGradients() {
            bgGradient = ctx.createLinearGradient(0, 0, 0, height);
            bgGradient.addColorStop(0, '#211a04'); 
            bgGradient.addColorStop(1, '#080601');

            wave1Y = height * 0.65;
            wave1Gradient = ctx.createLinearGradient(0, wave1Y - 240, 0, wave1Y + 240);
            wave1Gradient.addColorStop(0, 'rgba(204, 163, 0, 0)');
            wave1Gradient.addColorStop(0.5, 'rgba(255, 204, 0, 0.10)');
            wave1Gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            wave2Y = height * 0.60;
            wave2Gradient = ctx.createLinearGradient(0, wave2Y - 180, 0, wave2Y + 180);
            wave2Gradient.addColorStop(0, 'rgba(255, 230, 50, 0.04)');
            wave2Gradient.addColorStop(0.5, 'rgba(255, 215, 0, 0.18)');
            wave2Gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            neonWaveY = height * 0.55;
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            updateGradients();
        }

        window.addEventListener('resize', resize, { passive: true });
        resize();

        function drawPSPWave(yOffset, baseAmp, freq, speed, phaseOffset, fillStyle) {
            ctx.beginPath();
            const endX = width + 20;
            for (let x = 0; x <= endX; x += 10) {
                const noise = Math.sin(x * freq * 2 + time * speed * 1.5) * baseAmp * 0.3;
                const y = yOffset + noise + Math.sin(x * freq + time * speed + phaseOffset) * baseAmp;
                if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.lineTo(width, height + 100);
            ctx.lineTo(0, height + 100);
            ctx.closePath();
            ctx.fillStyle = fillStyle;
            ctx.fill();
        }

        function render(now) {
            const delta = Math.min((now - lastTime) / 16.6667, 3);
            lastTime = now;
            time += 0.005 * delta;

            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            drawPSPWave(wave1Y, 120, 0.001, 0.7, 0, wave1Gradient);
            drawPSPWave(wave2Y, 90, 0.0015, 1.1, 2, wave2Gradient);

            ctx.beginPath();
            const endX = width + 20;
            for (let x = 0; x <= endX; x += 10) {
                const noise = Math.sin(x * 0.003 + time * 1.8) * 8;
                const y = neonWaveY + noise + Math.sin(x * 0.002 + time * 1.5 + 4) * 60;
                if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.65)';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.shadowBlur = 16;
            ctx.shadowColor = 'rgba(255, 200, 0, 0.75)';
            ctx.stroke();
            ctx.shadowBlur = 0;

            animationFrameId = requestAnimationFrame(render);
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (animationFrameId) {
                    cancelAnimationFrame(animationFrameId);
                    animationFrameId = null;
                }
            } else {
                lastTime = performance.now();
                if (!animationFrameId) {
                    animationFrameId = requestAnimationFrame(render);
                }
            }
        });

        animationFrameId = requestAnimationFrame(render);
    </script>
